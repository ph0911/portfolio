name: Publish dev log

on:
  issues:
    types: [edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: dev-log-publisher
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      (github.event.action == 'labeled' && github.event.label.name ==
      'content:publish') || (github.event.action == 'edited' &&
        contains(github.event.issue.labels.*.name, 'content:publish')) ||
      (github.event.action == 'unlabeled' && github.event.label.name ==
      'content:publish')
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync issue to dev log
        run: node scripts/dev-log/cli.mjs
      - name: Validate website
        run: npm run check

  publish:
    needs: validate
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out current main without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Sync validated issue to dev log
        run: node scripts/dev-log/cli.mjs
      - name: Commit and push changed content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- content/log
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit \
            -m "content: sync dev log issue #${ISSUE_NUMBER}"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main
      - name: Confirm successful sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body
          "Der Dev-Log-Sync wurde erfolgreich ausgeführt."
      - name: Remove inbox label
        if: contains(github.event.issue.labels.*.name, 'content:inbox')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "content:inbox"
